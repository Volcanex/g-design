<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App shell</title>
<link rel="stylesheet" href="../../assets/g.css">
<script defer src="../../assets/g-ui.js"></script>
<style>
  body { display: grid; grid-template-columns: 224px 1fr; height: 100vh; overflow: hidden; }

  aside {
    display: flex; flex-direction: column; gap: 1px;
    padding: var(--sp-3);
    border-right: 1px solid var(--border-subtle);
  }
  .brand { display: flex; align-items: center; gap: 8px; padding: 6px 8px 14px; }
  .brand .mark {
    width: 22px; height: 22px; border-radius: var(--radius-sm);
    background: var(--accent-fill); color: var(--accent-fg);
    display: grid; place-items: center;
    font-size: 12px; font-weight: 500;
  }
  .brand b { font-size: 13px; font-weight: 500; }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    height: 30px; padding: 0 8px;
    border: none; border-radius: var(--radius-sm);
    background: none; color: var(--text-secondary);
    font-family: var(--font-ui); font-size: var(--font-size-ui); font-weight: 450;
    cursor: pointer; text-align: left;
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .nav-item svg { width: 15px; height: 15px; }
  .nav-item:hover { background: var(--fill-hover); color: var(--text-primary); }
  .nav-item[aria-current] { background: var(--fill-active); color: var(--text-primary); font-weight: 500; }
  .nav-head { padding: 14px 8px 5px; font-size: 11px; font-weight: 500; color: var(--text-placeholder); }
  .side-foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 8px; font-size: 12px; }
  .side-foot .who { display: flex; flex-direction: column; }
  .side-foot .who span:last-child { color: var(--text-placeholder); font-size: 11px; }

  main { display: flex; flex-direction: column; overflow: auto; }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px var(--sp-5);
    border-bottom: 1px solid var(--border-subtle);
    position: sticky; top: 0; background: var(--surface-1); z-index: 5;
  }
  .search { position: relative; width: 260px; }
  .search svg { position: absolute; left: 9px; top: 50%; translate: 0 -50%; width: 14px; height: 14px; color: var(--text-placeholder); }
  .search .input { padding-left: 30px; padding-right: 54px; }
  .search .keys { position: absolute; right: 7px; top: 50%; translate: 0 -50%; display: flex; gap: 3px; }

  .content { padding: var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-4); max-width: 980px; }
  .page-head { display: flex; align-items: center; gap: 10px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-4); }
  .stat { display: flex; flex-direction: column; gap: 4px; }
  .stat .v { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 12px; color: var(--text-secondary); }
  .stat .d { font-size: 12px; color: var(--ok-text); display: flex; align-items: center; gap: 4px; }
  .stat .d svg { width: 12px; height: 12px; }
  .stat .d.flat { color: var(--text-placeholder); }

  .panel-head { display: flex; align-items: center; gap: 10px; padding-bottom: var(--sp-3); }
  .feed { display: flex; flex-direction: column; }
  .feed-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-subtle); font-size: var(--font-size-ui); }
  .feed-item:last-child { border-bottom: none; }
  .feed-item .when { margin-left: auto; font-size: 12px; color: var(--text-placeholder); font-variant-numeric: tabular-nums; }
  .alert-row { display: flex; align-items: center; gap: 10px; }
  .alert-row .meta { display: flex; flex-direction: column; gap: 2px; }
  .alert-row .meta span:last-child { font-size: 12px; color: var(--text-secondary); }
  .settings-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); }
  .settings-row .meta { display: flex; flex-direction: column; gap: 2px; max-width: 420px; }
  .settings-row .meta span:last-child { font-size: 12px; color: var(--text-secondary); }
</style>
</head>

<script>
/* Router-lite: the chrome never re-renders. Content leaves in 100ms, the
   next view staggers in via g.swap. */
let currentView = null;
function render(name) {
  const view = document.getElementById("view");
