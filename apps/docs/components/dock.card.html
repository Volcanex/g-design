document.addEventListener("click", (e) => {
  if (e.target.closest("[data-theme-flip]")) {
    const light = document.documentElement.getAttribute("data-theme") === "light";
    if (window.g && g.theme) g.theme(light ? "dark" : "light");
    else document.documentElement.toggleAttribute("data-theme", !light);
  }
  if (e.target.closest("#add-todo")) {
    document.getElementById("todos").insertAdjacentHTML("beforeend",
      '<div class="list-item"><span class="main"><span>New todo</span></span><span class="end when">Today</span></div>');
  }
  const t = e.target.closest(".g-nav-toggle");
  if (t) t.closest(".g-shell").toggleAttribute("data-nav-open");
  if (e.target.closest(".g-scrim")) e.target.closest(".g-shell").removeAttribute("data-nav-open");
});
