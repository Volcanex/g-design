  /* The host's pages. Each is a plain list, enough to scroll and to show where you are. */
  const PAGES = {
    "": ["Home", ["Renew the domain", "Send the Hollow Pine invoice", "Dentist at 14:00", "Levels review at 16:00"]],
    upload: ["Upload", ["Drop files to send them to the drive"]],
    calendar: ["Calendar", ["Dentist at 14:00", "Levels review at 16:00", "Gym at 18:30"], true],

    notes: ["Notes", ["Garden plan", "Reading list"]],
  };
  const hostPage = document.querySelector("[data-page]");
  const title = document.querySelector("[data-title]");
  const hostLinks = [...document.querySelectorAll("body > aside a.nav-item")];
  let guest = null;

  function list(rows, base = "#/") {
    return `<div class="card fx-list"><div class="list">${rows.map((r) =>
      `<div class="list-item"><span class="main"><span>${r}</span></span></div>`).join("")}</div></div>`;
  }
  function lightRail(links, hash) {
    let best = null, len = -1;
    for (const a of links) {
      const h = a.getAttribute("href").replace(/\/$/, "");
      const at = hash.replace(/\/$/, "");
      const hit = h === "#" ? (at === "#" || at === "") : (at === h || at.startsWith(h + "/"));
      if (hit && h.length > len) { best = a; len = h.length; }
    }
    links.forEach((a) => a.removeAttribute("aria-current"));
    if (best) best.setAttribute("aria-current", "page");
    return best;
  }

  /* The guest: a second app in this one's content, as Studio sits in Command. Its rail
     changes with the scope (outside a site, or in one), so the dock watches it. */
  const GUEST_OUT = [
    ["#/studio/sites", "browsers", "Your sites", 1],
    ["#/studio/chat", "chat-circle-dots", "Chat", 2, 2],
    ["#/studio/notifications", "bell", "Notifications", 3],
    "Admin",
    ["#/studio/admin", "globe", "All sites"],
  ];
  const GUEST_IN = [
    ["#/studio/site/ada", "globe", "Ada Reyes ceramics", 1],
    ["#/studio/site/ada/pages", "files", "Pages", 2],
    ["#/studio/chat", "chat-circle-dots", "Chat", 3, 2],
    ["#/studio/site/ada/enquiries", "tray", "Enquiries", 4, 2],
    "Site",
    ["#/studio/site/ada/media", "browsers", "Media"],
    ["#/studio/sites", "browsers", "Your sites"],
  ];
  function guestRail(items) {
    return items.map((it) => typeof it === "string" ? `<div class="nav-head">${it}</div>` :
      `<a class="nav-item" href="${it[0]}"${it[3] ? ` data-pin="${it[3]}"` : ""}>${svg(it[1])}<span class="ellipsis">${it[2]}</span>${it[4] ? `<span class="badge badge-info num">${it[4]}</span>` : ""}</a>`).join("");
  }
  function mountGuest() {
    if (guest) return guest;
    hostPage.innerHTML = `<div class="guest-host"><div class="g-shell" data-rail="collapsed">
      <aside aria-label="Studio">
        <div class="brand-row"><a class="brand" href="#/studio/sites"><span class="g-mark" aria-hidden="true"></span><b>Studio</b></a>
          <button class="g-rail-toggle" type="button" data-rail-key="g-rail-dockcard-guest" aria-label="Keep open"></button></div>
        <nav class="nav-list" aria-label="Sections"></nav>
      </aside>
      <main>
        <header class="topbar"><button class="btn btn-tertiary btn-sm btn-icon g-nav-toggle" type="button" aria-label="Open menu">${svg("list")}</button>
          <span class="topbar-title" data-gtitle></span><span class="grow"></span></header>
        <div class="content"><div class="content-page" data-gpage></div></div>
      </main>
      <div class="g-scrim"></div>
    </div></div>`;
    const shell = hostPage.querySelector(".g-shell");
    guest = { shell, nav: shell.querySelector(".nav-list"), page: shell.querySelector("[data-gpage]"), title: shell.querySelector("[data-gtitle]"), scope: null };
    rail.wireRailToggle(shell.querySelector(".g-rail-toggle"));
    guest.unwire = rail.wireDock ? rail.wireDock(shell) : () => {};
    return guest;
  }
  function unmountGuest() {
    if (!guest) return;
    guest.unwire && guest.unwire();
    guest = null;
  }
  function routeGuest(hash) {
    const g = mountGuest();
    const inSite = hash.startsWith("#/studio/site/");
    const scope = inSite ? "in" : "out";
    if (g.scope !== scope) { g.nav.innerHTML = guestRail(inSite ? GUEST_IN : GUEST_OUT); g.scope = scope; }
    const cur = lightRail([...g.nav.querySelectorAll("a.nav-item")], hash === "#/studio" ? "#/studio/sites" : hash);
    const name = cur ? cur.querySelector(".ellipsis").textContent : "Your sites";
    g.title.textContent = name;
    if (name === "Your sites") g.page.innerHTML = `<div class="card fx-list"><div class="list">
        <div class="list-item"><a class="main" href="#/studio/site/ada/pages"><span>Ada Reyes ceramics</span><span class="sub">Open its pages</span></a></div>
        <div class="list-item"><span class="main"><span>Hollow Pine</span></span></div></div></div>`;
    else if (name === "Chat") g.page.innerHTML = `${list(["Ada: can we move the shop page up", "You: yes, done"])}<label class="field"><span class="label">Reply</span><textarea class="input" rows="3" placeholder="Write a reply"></textarea></label>`;
    else g.page.innerHTML = list(name === "Pages" ? ["Home", "About", "Work", "Exhibitions", "Shop", "Contact"] : [`${name} for Ada Reyes ceramics`]);
  }

  function route() {
    const hash = location.hash || "#/";
    const key = hash.replace(/^#\/?/, "").split("/")[0];
    document.body.dataset.route = key || "home";
    const cur = lightRail(hostLinks, hash);
    title.textContent = cur ? cur.querySelector(".ellipsis").textContent : "Home";
    if (key === "studio") { routeGuest(hash); return; }
    unmountGuest();
    const [name, rows, field] = PAGES[key] || PAGES[""];
    hostPage.innerHTML = list(rows) + (field ? `<label class="field"><span class="label">New event</span><input class="input" placeholder="Add an event"></label>` : "")
      + list(Array.from({ length: 12 }, (_, i) => `${name}, earlier entry ${i + 1}`));
  }
  addEventListener("hashchange", route);
  route();
  rail.wireRails();
